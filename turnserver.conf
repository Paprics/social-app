# turnserver.conf — конфигурация coturn TURN сервера
#
# Что такое TURN:
#   Когда два пользователя не могут соединиться напрямую (корпоративный
#   файрвол, симметричный NAT, мобильный оператор) — медиа идёт через
#   TURN сервер как relay. Без TURN у части пользователей видео не заработает.

# Порт на котором слушает TURN сервер
listening-port=3478

# Порт для TURN over TLS (нужен на проде с HTTPS)
tls-listening-port=5349

# Диапазон портов для relay медиа трафика
min-port=49152
max-port=49200

# Логин и пароль для TURN аутентификации.
# ВАЖНО: на проде поменяй на сложные значения!
# Должны совпадать с TURN_USER и TURN_PASSWORD в docker-compose.yml
user=myuser:mypassword

# Realm — домен сервера. На проде замени на свой домен.
realm=localhost

# Fingerprint — добавляет цифровую подпись к TURN пакетам
fingerprint

# Запрещаем использовать TURN как открытый прокси
no-multicast-peers

# Логи — куда писать
log-file=/var/log/coturn/turnserver.log

# Verbose логирование (убери на проде для производительности)
verbose