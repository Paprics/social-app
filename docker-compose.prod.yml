# docker-compose.prod.yml — продовая конфигурация
#
# Отличия от dev:
#   - Daphne вместо runserver (production ASGI сервер)
#   - PostgreSQL вместо SQLite
#   - Nginx как reverse proxy (раздаёт статику, проксирует на Daphne)
#   - coturn для WebRTC за NAT
#   - Нет volumes с кодом — код копируется при билде (COPY src/ .)
#   - Все секреты через переменные окружения

services:

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-socialnetwork}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      # Данные БД сохраняются между перезапусками
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    restart: always
    # Daphne — production ASGI сервер.
    # В отличие от runserver не перезапускается при изменении кода
    # и умеет держать тысячи WebSocket соединений.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 _config.asgi:application"
    # На проде НЕТ volumes с кодом — используем то что скопировано при билде
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DJANGO_SETTINGS_MODULE=_config.settings
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-socialnetwork}
      - REDIS_URL=redis://redis:6379/0
      - TURN_URL=${TURN_URL:-turn:localhost:3478}
      - TURN_USER=${TURN_USER:-myuser}
      - TURN_PASSWORD=${TURN_PASSWORD:-mypassword}

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Статика Django — collectstatic кладёт сюда, nginx раздаёт напрямую
      - static_files:/app/static:ro
      # SSL сертификаты (Let's Encrypt или свои)
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web

  coturn:
    image: coturn/coturn:latest
    restart: always
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/udp"
      - "5349:5349/tcp"
      - "49152:49200/udp"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: -c /etc/coturn/turnserver.conf

volumes:
  postgres_data:
  static_files: