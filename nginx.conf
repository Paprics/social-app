# nginx.conf
#
# Internal reverse proxy for Flingon.
# Public TLS is terminated by Caddy.
#
# Internet -> Caddy :443 -> flingon-nginx :80 -> Daphne :8000

upstream daphne {
    server web:8000;
    keepalive 32;
}

# Preserve the original protocol received from Caddy.
# If nginx is accessed directly inside the Docker network, fall back to its own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name flingon.xyz www.flingon.xyz;

    # Photo/file uploads.
    client_max_body_size 20M;

    # Django collectstatic output.
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # User-uploaded files.
    # Do not mark these immutable: media can be changed/replaced.
    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # WebSocket endpoints.
    location /ws/ {
        proxy_pass http://daphne;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;

        proxy_buffering off;
    }

    # Django / HTMX / normal HTTP requests.
    location / {
        proxy_pass http://daphne;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
