# nginx.conf — конфигурация reverse proxy для продового сервера
#
# Что делает nginx:
#   1. Раздаёт статические файлы напрямую (быстро, без Django)
#   2. Проксирует HTTP запросы на Daphne
#   3. Проксирует WebSocket соединения на Daphne
#   4. Перенаправляет HTTP → HTTPS
#   5. Терминирует SSL (расшифровывает HTTPS, дальше идёт plain HTTP)

# Upstream — адрес Daphne внутри Docker сети
upstream daphne {
    server web:8000;
}

# HTTP — только редирект на HTTPS
server {
    listen 80;
    server_name _;  # Замени на свой домен: example.com www.example.com

    # Let's Encrypt верификация домена (нужна при первом получении сертификата)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всё остальное → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — основной сервер
server {
    listen 443 ssl;
    server_name _;  # Замени на свой домен

    # SSL сертификаты — положи в папку ./ssl/
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Современные настройки SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Статические файлы — nginx раздаёт сам, Django не трогает
    # collectstatic копирует файлы в /app/static, volume шарится с nginx
    location /static/ {
        alias /app/static/;
        expires 30d;  # Кешируем на 30 дней
        add_header Cache-Control "public, immutable";
    }

    # WebSocket соединения — специальный проксинг
    # Обычный HTTP proxy не поддерживает WebSocket, нужны эти заголовки
    location /ws/ {
        proxy_pass http://daphne;
        proxy_http_version 1.1;

        # Эти заголовки переключают HTTP на WebSocket протокол
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймаут WebSocket — 24 часа (WebSocket соединение долгоживущее)
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Все остальные HTTP запросы → Daphne
    location / {
        proxy_pass http://daphne;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Максимальный размер тела запроса (для загрузки файлов)
        client_max_body_size 10M;
    }
}