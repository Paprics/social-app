[tool.ruff]
target-version = "py312"
line-length = 120

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "migrations",
    "media",
    "staticfiles",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # simplify
]

ignore = [
    "E501", # длинные строки (если не хочешь, чтобы ругался)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.black]
line-length = 120
target-version = ["py312"]

skip-string-normalization = false
skip-magic-trailing-comma = false