# compose.dev.yml — локальная разработка
#
# Все сервисы в контейнерах, код монтируется через volume.
# Django запускается командой runserver — горячая перезагрузка при изменении файлов.
# Nginx НЕ нужен на dev — Django слушает напрямую на порту 8000.
# coturn НЕ нужен на dev — WebRTC тестируется без relay.

services:

  postgres:
    image: postgres:17-alpine
    container_name: sn-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sn-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: sn-web-dev
    restart: unless-stopped
    # migrate + runserver с ASGI через daphne для поддержки WebSocket
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      # Код монтируется с хоста — изменения подхватываются без пересборки
      - ../src:/app
    ports:
      - "8000:8000"
    env_file:
      - ../.env.dev
    environment:
      DJANGO_SETTINGS_MODULE: _config.settings.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: sn-celery-worker-dev
    restart: unless-stopped
    command: celery -A _config worker --loglevel=info
    volumes:
      - ../src:/app
    env_file:
      - ../.env.dev
    environment:
      DJANGO_SETTINGS_MODULE: _config.settings.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: sn-celery-beat-dev
    restart: unless-stopped
    command: celery -A _config beat --loglevel=info
    volumes:
      - ../src:/app
    env_file:
      - ../.env.dev
    environment:
      DJANGO_SETTINGS_MODULE: _config.settings.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started

volumes:
  postgres_dev_data:
    external: true
    name: social-network_postgres_dev_data