# docker/compose.prod.yml

services:
  postgres:
    image: postgres:17-alpine
    container_name: flingon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ${DATA_ROOT:-../.prod_data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: flingon-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ${DATA_ROOT:-../.prod_data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    container_name: flingon-web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 _config.asgi:application"
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: _config.settings.prod
    volumes:
      - static_data:/app/staticfiles
      - ${DATA_ROOT:-../.prod_data}/media:/app/media
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    container_name: flingon-celery-worker
    restart: unless-stopped
    command: celery -A _config worker --loglevel=info
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: _config.settings.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    container_name: flingon-celery-beat
    restart: unless-stopped
    command: celery -A _config beat --loglevel=info
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: _config.settings.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    container_name: flingon-nginx
    restart: unless-stopped
    volumes:
      - ../nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - ${DATA_ROOT:-../.prod_data}/media:/app/media:ro
    depends_on:
      web:
        condition: service_started
    networks:
      - internal
      - proxy

volumes:
  static_data:
    name: flingon-static

networks:
  internal:
    name: flingon-internal
    driver: bridge

  proxy:
    external: true
    name: proxy