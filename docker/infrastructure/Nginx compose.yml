# infrastructure/nginx/compose.yml
#
# Один nginx на весь сервер. Запускается первым, создаёт frontend_network.
# Все сайты (social-network, blog, ...) подключаются к этой сети
# и nginx видит их контейнеры по имени.
#
# Запуск: docker compose up -d
# Это создаёт сеть frontend_network которую используют все проекты.

services:

  nginx:
    image: nginx:alpine
    container_name: infra-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      # Certbot кладёт сертификаты сюда
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    networks:
      - frontend_network

  certbot:
    image: certbot/certbot
    container_name: infra-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Запускается вручную: docker compose run --rm certbot certonly ...
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  certbot_www:
  certbot_certs:

networks:
  frontend_network:
    # Эту сеть создаём здесь, все проекты к ней подключаются как external
    driver: bridge
    name: frontend_network