# infrastructure/coturn/compose.yml
#
# Один TURN сервер на весь сервер — может обслуживать все проекты с WebRTC.
# social-network и любой другой сайт просто указывает TURN_URL в своём .env.prod.
#
# Запуск: docker compose up -d

services:

  coturn:
    image: coturn/coturn:latest
    container_name: infra-coturn
    restart: always
    network_mode: host
    # network_mode: host нужен для TURN — иначе Docker NAT ломает relay логику.
    # TURN серверу нужно видеть реальные IP клиентов.
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      - coturn_logs:/var/log/coturn
    command: -c /etc/coturn/turnserver.conf

volumes:
  coturn_logs: