services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  coturn:
    image: coturn/coturn:latest
    # Пробрасываем порты для TURN/STUN:
    # 3478 — стандартный порт STUN/TURN (UDP и TCP)
    # 5349 — TURN over TLS (для прода с HTTPS)
    # 49152-49200 — диапазон UDP портов для медиа relay
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/udp"
      - "5349:5349/tcp"
      - "49152:49200/udp"
    volumes:
      # Монтируем конфиг файл который создадим рядом
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: -c /etc/coturn/turnserver.conf

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./src:/app
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/0
      # Эти переменные Django передаёт в RTC_CONFIG шаблона
      # Измени на свой публичный IP на проде
      - TURN_URL=turn:localhost:3478
      - TURN_USER=myuser
      - TURN_PASSWORD=mypassword
    working_dir: /app