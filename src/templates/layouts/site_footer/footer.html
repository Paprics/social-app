{% load i18n %}

<footer class="mt-auto border-t border-slate-200 bg-white">

    <div class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">

        <div class="flex flex-col gap-6 md:flex-row md:items-center md:justify-between">

            {# Brand / description #}
            <div class="max-w-md">

                <a href="{% url 'core:index' %}"
                   class="inline-flex items-baseline gap-1">

                    <span class="text-lg font-bold tracking-tight text-slate-900">
                        fling
                    </span>

                    <span class="text-lg font-black text-blue-600">
                        ON
                    </span>

                    <span class="text-xs font-semibold text-slate-400">
                        .xyz
                    </span>

                </a>

                <p class="mt-2 text-sm leading-6 text-slate-500">
                    {% trans "Connect, meet and discover new people." %}
                </p>

            </div>


            {# Links #}
            <nav class="flex flex-wrap gap-x-6 gap-y-3 text-sm text-slate-500">

                <a href="#"
                   class="transition hover:text-slate-900">
                    {% trans "About" %}
                </a>

                <a href="#"
                   class="transition hover:text-slate-900">
                    {% trans "Safety" %}
                </a>

                <a href="#"
                   class="transition hover:text-slate-900">
                    {% trans "Terms" %}
                </a>

                <a href="#"
                   class="transition hover:text-slate-900">
                    {% trans "Privacy" %}
                </a>

                <a href="#"
                   class="transition hover:text-slate-900">
                    {% trans "Contact" %}
                </a>

            </nav>

        </div>


        <div class="mt-7 flex flex-col gap-3 border-t border-slate-100 pt-5
                    text-xs text-slate-400
                    sm:flex-row sm:items-center sm:justify-between">

            <p>
                © {% now "Y" %} flingON.xyz
            </p>

            <p>
                {% trans "For adults only" %} · 18+
            </p>

        </div>

    </div>

</footer>
