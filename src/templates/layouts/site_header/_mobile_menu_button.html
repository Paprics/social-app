{% load i18n %}

<button type="button"
        id="mobile-menu-button"
        aria-controls="mobile-menu"
        aria-expanded="false"
        aria-label="{% trans 'Open menu' %}"
        class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 bg-white/80 text-slate-600 transition hover:bg-white hover:text-slate-900 xl:hidden">

    <svg data-mobile-menu-open-icon
         xmlns="http://www.w3.org/2000/svg"
         fill="none"
         viewBox="0 0 24 24"
         stroke-width="2"
         stroke="currentColor"
         class="h-5 w-5"
         aria-hidden="true">
        <path stroke-linecap="round"
              stroke-linejoin="round"
              d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
    </svg>

    <svg data-mobile-menu-close-icon
         xmlns="http://www.w3.org/2000/svg"
         fill="none"
         viewBox="0 0 24 24"
         stroke-width="2"
         stroke="currentColor"
         class="hidden h-5 w-5"
         aria-hidden="true">
        <path stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 18 18 6M6 6l12 12"/>
    </svg>

</button>
