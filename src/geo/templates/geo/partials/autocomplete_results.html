{% load i18n %}
{% if cities %}
<ul class="absolute z-50 w-full bg-white border border-gray-200 rounded-lg shadow-lg mt-1 max-h-60 overflow-y-auto">
    {% for city in cities %}
    <li class="px-4 py-2 hover:bg-gray-100 cursor-pointer text-sm"
        data-js-autocomplete-item
        data-city-id="{{ city.pk }}"
        data-city-name="{{ city.get_name }}">
        <span class="font-medium">{{ city.get_name }}</span>
        {% if city.region %}
        <span class="text-gray-500 text-xs ml-1">{{ city.region.get_name }}</span>
        {% endif %}
    </li>
    {% endfor %}
</ul>
{% elif q|length >= 2 %}
<ul class="absolute z-50 w-full bg-white border border-gray-200 rounded-lg shadow-lg mt-1">
    <li class="px-4 py-2 text-sm text-gray-400">{% trans "Nothing found" %}</li>
</ul>
{% endif %}
