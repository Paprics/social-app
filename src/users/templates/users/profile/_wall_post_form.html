{% load static i18n render_image %}

{% if access.can_post_on_wall %}

    <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">

        <form hx-post="{% url 'posts:wall_create' target_user.pk %}"
              hx-target="#wall-posts"
              hx-swap="afterbegin"
              hx-on::after-request="if(event.detail.successful){ this.reset(); }">

            {% csrf_token %}

            <div class="flex gap-3">

                <div class="shrink-0">
                    {% render_image request.user.profile.avatar_photo.image variant="avatar_sm" alt=request.user.username shape="circle" css_class="h-10 w-10 object-cover" %}
                </div>

                <div class="min-w-0 flex-1">

                    <textarea name="content"
                              rows="3"
                              required
                              maxlength="5000"
                              class="wall-post-textarea w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-800 placeholder-slate-400 transition duration-200 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-1 focus:ring-blue-500"
                              placeholder="{% trans 'Write something on the wall...' %}"></textarea>

                    <div class="mt-3 flex justify-end">
                        <button type="submit"
                                class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow-sm transition duration-200 hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50">
                            {% trans "Post" %}
                        </button>
                    </div>

                </div>

            </div>

        </form>

    </div>

{% endif %}
