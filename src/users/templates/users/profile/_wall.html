{% load static i18n render_image gender_icon %}

<div class="rounded-xl border border-slate-200 bg-white shadow-sm">
    <div class="flex items-center justify-between border-b border-slate-100 px-5 py-4">
        <h2 class="text-sm font-semibold text-slate-700">{% trans "Wall" %}</h2>
    </div>
    <div id="wall-posts"
         class="divide-y divide-slate-100"
         hx-get="{% url 'posts:wall_posts' target_user.pk %}"
         hx-trigger="revealed once"
         hx-target="this"
         hx-swap="innerHTML">
        <div class="flex items-center justify-center py-10">
            <div class="flex flex-col items-center gap-3 text-slate-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 animate-spin" fill="none" viewBox="0 0 24 24"
                     stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M4 4v5h.582M20 20v-5h-.581M5.636 18.364A9 9 0 1020 12"/>
                </svg>
                <span class="text-sm">{% trans "Loading posts..." %}</span>
            </div>
        </div>
    </div>
</div>
