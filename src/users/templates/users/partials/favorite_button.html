{% load i18n %}

<button
        type="button"
        hx-post="{{ favorite_url }}"
        hx-target="this"
        hx-swap="outerHTML"
        class="flex w-full items-center justify-center gap-2 rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium shadow-sm transition duration-200 hover:bg-slate-50
           {% if is_favorite %}text-amber-600{% else %}text-slate-700{% endif %}"
>
    {% if is_favorite %}
    <svg xmlns="http://www.w3.org/2000/svg"
         class="h-4 w-4 shrink-0 text-amber-500"
         fill="currentColor"
         viewBox="0 0 24 24">
        <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
    </svg>
    {% trans "Remove from favorites" %}
    {% else %}
    <svg xmlns="http://www.w3.org/2000/svg"
         class="h-4 w-4 shrink-0 text-slate-400"
         fill="none"
         viewBox="0 0 24 24"
         stroke="currentColor"
         stroke-width="2">
        <path stroke-linecap="round"
              stroke-linejoin="round"
              d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
    </svg>
    {% trans "Add to favorites" %}
    {% endif %}
</button>
