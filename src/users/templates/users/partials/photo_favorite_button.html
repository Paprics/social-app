{% load i18n %}

<button type="button"
        hx-post="{% url 'users:photo_favorite_toggle' photo.pk %}"
        hx-target="this"
        hx-swap="outerHTML"
        class="ml-auto flex items-center gap-2 text-sm font-medium transition
               {% if is_favorite %}
                   text-amber-500 hover:text-amber-600
               {% else %}
                   text-slate-600 hover:text-slate-900
               {% endif %}"
        title="{% if is_favorite %}{% trans 'Remove from favorites' %}{% else %}{% trans 'Add to favorites' %}{% endif %}">

    <svg xmlns="http://www.w3.org/2000/svg"
         class="h-5 w-5 shrink-0"
         viewBox="0 0 24 24"
         fill="{% if is_favorite %}currentColor{% else %}white{% endif %}"
         stroke="currentColor"
         stroke-width="1.8"
         aria-hidden="true">

        <path stroke-linecap="round"
              stroke-linejoin="round"
              d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.562.562 0 00-.586 0l-4.725 2.885a.562.562 0 01-.84-.61l1.285-5.385a.562.562 0 00-.182-.557L3.04 10.385a.562.562 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345l2.125-5.111z"/>
    </svg>

    <span>
        {% if is_favorite %}
            {% trans "Remove from favorites" %}
        {% else %}
            {% trans "Add to favorites" %}
        {% endif %}
    </span>

</button>
