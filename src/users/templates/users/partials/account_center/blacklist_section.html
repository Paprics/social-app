{% load static i18n %}
<section id="blacklist" class="bg-white border border-slate-200 rounded-xl overflow-hidden scroll-mt-20">
    <div class="px-6 py-4 border-b border-slate-100">
        <h2 class="text-base font-semibold text-slate-900">{% trans "Blacklist" %}</h2>
        <p class="text-sm text-slate-500 mt-0.5">{% trans "Users you have blocked." %}</p>
    </div>
    <div class="px-6 py-5">
        <div class="space-y-3">
            <div class="flex items-center gap-4 p-3 bg-slate-50 rounded-xl">
                <div class="w-10 h-10 rounded-full bg-slate-300 shrink-0"></div>
                <div class="flex-1">
                    <p class="text-sm font-medium text-slate-900">toxic_user_99</p>
                    <p class="text-xs text-slate-500">Blocked on 2025-03-10</p>
                </div>
                <button class="px-3 py-1 bg-white border border-slate-300 text-slate-700 text-xs font-medium rounded-lg hover:bg-slate-50 transition">
                    Unblock
                </button>
            </div>
            <div class="flex items-center gap-4 p-3 bg-slate-50 rounded-xl">
                <div class="w-10 h-10 rounded-full bg-slate-300 shrink-0"></div>
                <div class="flex-1">
                    <p class="text-sm font-medium text-slate-900">spam_bot_2024</p>
                    <p class="text-xs text-slate-500">Blocked on 2025-02-28</p>
                </div>
                <button class="px-3 py-1 bg-white border border-slate-300 text-slate-700 text-xs font-medium rounded-lg hover:bg-slate-50 transition">
                    Unblock
                </button>
            </div>
        </div>
    </div>
</section>
