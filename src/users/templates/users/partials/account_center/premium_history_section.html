{% load static i18n %}
<section id="premium-history"
         class="bg-white border border-slate-200 rounded-xl overflow-hidden scroll-mt-20 opacity-60 pointer-events-none">
    <div class="px-6 py-4 border-b border-slate-100 flex items-center gap-2">
        <h2 class="text-base font-semibold text-slate-900">{% trans "Premium Purchase History" %}</h2>
        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-slate-200 text-slate-600 text-xs font-medium">
              <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path
                      d="M10 2a8 8 0 100 16 8 8 0 000-16zm1 11.5a1 1 0 11-2 0 1 1 0 012 0zm.25-3.25a.75.75 0 00-1.5 0v-2a.75.75 0 001.5 0v2z"/></svg>
              soon
            </span>
    </div>
    <div class="px-6 py-5">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-slate-200 text-sm">
                <thead>
                <tr class="text-left text-xs text-slate-500 uppercase tracking-wider">
                    <th class="px-3 py-2">Date</th>
                    <th class="px-3 py-2">Plan</th>
                    <th class="px-3 py-2">Amount</th>
                    <th class="px-3 py-2">Status</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                <tr>
                    <td class="px-3 py-2 text-slate-400">2025-02-01</td>
                    <td class="px-3 py-2 text-slate-400">1 Month</td>
                    <td class="px-3 py-2 text-slate-400">$9.99</td>
                    <td class="px-3 py-2 text-green-600">Completed</td>
                </tr>
                <tr>
                    <td class="px-3 py-2 text-slate-400">2025-01-01</td>
                    <td class="px-3 py-2 text-slate-400">1 Week</td>
                    <td class="px-3 py-2 text-slate-400">$3.99</td>
                    <td class="px-3 py-2 text-green-600">Completed</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
