{% load static i18n %}
<section id="favorites" class="bg-white border border-slate-200 rounded-xl overflow-hidden scroll-mt-20">
          <div class="px-6 py-4 border-b border-slate-100">
            <h2 class="text-base font-semibold text-slate-900">{% trans "Favorites" %}</h2>
            <p class="text-sm text-slate-500 mt-0.5">{% trans "Your saved photos and profiles." %}</p>
          </div>

          <div class="border-b border-slate-100 px-6 pt-3">
            <div class="flex gap-6 text-sm font-medium" data-tabs="fav-tabs">
              <button class="tab-btn text-blue-600 border-b-2 border-blue-600 pb-2" data-target="fav-photos">{% trans "Photos" %}</button>
              <button class="tab-btn text-slate-500 hover:text-slate-700 pb-2 border-b-2 border-transparent" data-target="fav-profiles">{% trans "Profiles" %}</button>
            </div>
          </div>

          <div class="px-6 py-5">
            <!-- Favorite photos -->
            <div id="fav-photos" class="tab-pane">
              <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                <div class="aspect-square rounded-xl bg-slate-200 flex items-center justify-center text-slate-400 text-sm">Photo 1</div>
                <div class="aspect-square rounded-xl bg-slate-200 flex items-center justify-center text-slate-400 text-sm">Photo 2</div>
                <div class="aspect-square rounded-xl bg-slate-200 flex items-center justify-center text-slate-400 text-sm">Photo 3</div>
                <div class="aspect-square rounded-xl bg-slate-200 flex items-center justify-center text-slate-400 text-sm">Photo 4</div>
              </div>
              <p class="text-xs text-slate-400 mt-4">4 favorite photos</p>
            </div>
            <!-- Favorite profiles -->
            <div id="fav-profiles" class="tab-pane hidden">
              <div class="space-y-3">
                <div class="flex items-center gap-4 p-3 bg-slate-50 rounded-xl">
                  <div class="w-10 h-10 rounded-full bg-slate-300 shrink-0"></div>
                  <p class="text-sm font-medium text-slate-900">emerald_eye</p>
                  <button class="ml-auto px-3 py-1 bg-white border border-slate-300 text-slate-700 text-xs font-medium rounded-lg hover:bg-slate-50 transition">Remove</button>
                </div>
                <div class="flex items-center gap-4 p-3 bg-slate-50 rounded-xl">
                  <div class="w-10 h-10 rounded-full bg-slate-300 shrink-0"></div>
                  <p class="text-sm font-medium text-slate-900">nova_star</p>
                  <button class="ml-auto px-3 py-1 bg-white border border-slate-300 text-slate-700 text-xs font-medium rounded-lg hover:bg-slate-50 transition">Remove</button>
                </div>
              </div>
            </div>
          </div>
        </section>
