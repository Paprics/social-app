{% load i18n %}

<section id="favorites"
         class="overflow-hidden rounded-xl border border-slate-200 bg-white scroll-mt-20">

    <div class="border-b border-slate-100 px-6 py-4">
        <h2 class="text-base font-semibold text-slate-900">
            {% trans "Favorites" %}
        </h2>

        <p class="mt-0.5 text-sm text-slate-500">
            {% trans "Your saved photos and profiles." %}
        </p>
    </div>

    <div class="border-b border-slate-100 px-6 pt-3">
        <div class="flex gap-6 text-sm font-medium"
             data-tabs="fav-tabs">

            <button type="button"
                    class="tab-btn border-b-2 border-blue-600 pb-2 text-blue-600"
                    data-target="fav-photos">
                {% trans "Photos" %}
            </button>

            <button type="button"
                    class="tab-btn border-b-2 border-transparent pb-2 text-slate-500 hover:text-slate-700"
                    data-target="fav-profiles">
                {% trans "Profiles" %}
            </button>

        </div>
    </div>

    <div class="px-6 py-5">

        <div id="fav-photos"
             class="tab-pane"
             hx-get="{% url 'users:account_center_favorite_photos' %}"
             hx-trigger="load"
             hx-swap="innerHTML">

            <div class="py-8 text-center text-sm text-slate-400">
                {% trans "Loading favorite photos..." %}
            </div>

        </div>

        <div id="fav-profiles"
             class="tab-pane hidden"
             hx-get="{% url 'users:account_center_favorite_profiles' %}"
             hx-trigger="load"
             hx-swap="innerHTML">

            <div class="py-8 text-center text-sm text-slate-400">
                {% trans "Loading favorite profiles..." %}
            </div>

        </div>

    </div>

</section>
