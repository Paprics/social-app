{% load i18n %}

{% if photos %}

    <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4"
         data-lightbox-group>

        {% for photo in photos %}

            <div id="favorite-photo-{{ photo.pk }}"
                 class="relative">

                {% include "gallery/components/_photo_card.html" with photo=photo %}

                <button type="button"
                        hx-post="{% url 'users:photo_favorite_toggle' photo.pk %}"
                        hx-target="#favorite-photo-{{ photo.pk }}"
                        hx-swap="delete"
                        class="absolute right-2 top-2 z-10 flex h-8 w-8 items-center justify-center rounded-full bg-white/95 text-amber-500 shadow transition hover:bg-white hover:text-amber-600"
                        title="{% trans 'Remove from favorites' %}"
                        aria-label="{% trans 'Remove from favorites' %}">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         class="h-4 w-4"
                         viewBox="0 0 24 24"
                         fill="currentColor"
                         aria-hidden="true">
                        <path d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.562.562 0 00-.586 0l-4.725 2.885a.562.562 0 01-.84-.61l1.285-5.385a.562.562 0 00-.182-.557L3.04 10.385a.562.562 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345l2.125-5.111z"/>
                    </svg>

                </button>

            </div>

        {% endfor %}

    </div>

    {% include "users/partials/account_center/_favorites_pagination.html" %}

{% else %}

    <div class="py-8 text-center">
        <p class="text-sm text-slate-500">
            {% trans "You have no favorite photos yet." %}
        </p>
    </div>

{% endif %}
