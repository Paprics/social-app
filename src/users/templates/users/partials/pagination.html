{% if is_paginated %}
<nav class="flex items-center justify-between border-t border-slate-200 px-6 py-4">

    <div>
        {% if page_obj.has_previous %}
            <a
                hx-get="{{ pagination_url }}?page={{ page_obj.previous_page_number }}"
                hx-target="#friends-content"
                hx-swap="innerHTML"
                class="px-3 py-2 rounded-lg border hover:bg-slate-50">
                ← Previous
            </a>
        {% endif %}
    </div>

    <div class="text-sm text-slate-500">
        {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}
    </div>

    <div>
        {% if page_obj.has_next %}
            <a
                hx-get="{{ pagination_url }}?page={{ page_obj.next_page_number }}"
                hx-target="#friends-content"
                hx-swap="innerHTML"
                class="px-3 py-2 rounded-lg border hover:bg-slate-50">
                Next →
            </a>
        {% endif %}
    </div>

</nav>
{% endif %}
