{% load i18n %}

<div id="friendship-actions">

    {% if not friendship.is_self %}

        {% if friendship.is_friend %}

            <form
                hx-post="{% url 'users:friend_remove' target_user.pk %}"
                hx-target="#friendship-actions"
                hx-swap="outerHTML">

                <button
                    type="submit"
                    class="flex w-full items-center justify-center gap-2 rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-red-600 shadow-sm transition duration-200 hover:bg-slate-50">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         class="h-4 w-4 shrink-0 text-red-600"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor"
                         stroke-width="2">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M6 18L18 6M6 6l12 12"/>
                    </svg>

                    {% trans "Remove from friends" %}

                </button>

            </form>

        {% elif friendship.outgoing_request %}

            <form
                hx-post="{% url 'users:friend_request_cancel' target_user.pk %}"
                hx-target="#friendship-actions"
                hx-swap="outerHTML">

                <button
                    type="submit"
                    class="flex w-full items-center justify-center gap-2 rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-yellow-600 shadow-sm transition duration-200 hover:bg-slate-50">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         class="h-4 w-4 shrink-0 text-yellow-600"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor"
                         stroke-width="2">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M5 13l4 4L19 7"/>
                    </svg>

                    {% trans "Cancel friend request" %}

                </button>

            </form>

        {% elif friendship.incoming_request %}

            <form
                hx-post="{% url 'users:friend_request_accept' target_user.pk %}"
                hx-target="#friendship-actions"
                hx-swap="outerHTML">

                <button
                    type="submit"
                    class="flex w-full items-center justify-center gap-2 rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-green-600 shadow-sm transition duration-200 hover:bg-slate-50">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         class="h-4 w-4 shrink-0 text-green-600"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor"
                         stroke-width="2">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M5 13l4 4L19 7"/>
                    </svg>

                    {% trans "Accept friend request" %}

                </button>

            </form>

            <form
                class="mt-2"
                hx-post="{% url 'users:friend_request_decline' target_user.pk %}"
                hx-target="#friendship-actions"
                hx-swap="outerHTML">

                <button
                    type="submit"
                    class="flex w-full items-center justify-center gap-2 rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-red-600 shadow-sm transition duration-200 hover:bg-slate-50">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         class="h-4 w-4 shrink-0 text-red-600"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor"
                         stroke-width="2">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M6 18L18 6M6 6l12 12"/>
                    </svg>

                    {% trans "Decline friend request" %}

                </button>

            </form>

        {% elif friendship.can_send_request %}

            <form
                hx-post="{% url 'users:friend_request_send' profile_user.pk %}"
                hx-target="#friendship-actions"
                hx-swap="outerHTML">

                <button
                    type="submit"
                    class="flex w-full items-center justify-center gap-2 rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-blue-600 shadow-sm transition duration-200 hover:bg-slate-50">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         class="h-4 w-4 shrink-0 text-blue-600"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor"
                         stroke-width="2">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                    </svg>

                    {% trans "Add to friends" %}

                </button>

            </form>

        {% endif %}

    {% endif %}

</div>
