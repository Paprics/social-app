{% load static i18n %}

<div class="relative overflow-hidden rounded-xl group cursor-not-allowed">
    <!-- Основной блок (без скругления, оно на внешней обёртке) -->
    <div class="border border-slate-200 bg-white p-4 shadow-sm">
        <h2 class="text-sm font-semibold text-slate-700 mb-3">{% trans "Regional Leader" %}</h2>
        <div class="flex flex-col items-center text-center gap-2">
            <!-- Аватар (заглушка) -->
            <div class="h-14 w-14 rounded-full bg-slate-100 overflow-hidden flex items-center justify-center text-slate-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
            </div>
            <div>
                <!-- Имя без ссылки, просто текст -->
                <p class="text-sm font-medium text-slate-700">leader_user</p>
                <p class="text-xs text-slate-400 mt-0.5">{% trans "Top member of your city" %}</p>
            </div>
            <!-- Кнопка всегда неактивна -->
            <button type="button"
                    class="w-full rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-medium text-slate-400 cursor-not-allowed"
                    disabled>
                {% trans "Claim the top spot" %}
            </button>
        </div>
    </div>

    <!-- Оверлей -->
    <div class="absolute inset-0 bg-white/60 backdrop-blur-[2px] flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none rounded-xl">
        <svg class="w-12 h-12 text-slate-400 mb-2" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2zm10-10V7a4 4 0 0 0-8 0v4h8z" />
        </svg>
        <span class="text-sm font-medium text-slate-600">{% trans "Under development" %}</span>
        <span class="text-xs text-slate-500 mt-1">{% trans "Will be available soon" %}</span>
    </div>
</div>
