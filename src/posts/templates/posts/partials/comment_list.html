{% load i18n %}

<div class="space-y-3">

    <div id="comment-items-{{ post.pk }}"
         class="space-y-2">

        {% include "posts/partials/comment_page.html" %}

    </div>

    {% if can_comment %}

        <form hx-post="{% url 'posts:comment_create' post.pk %}"
              hx-target="#comment-items-{{ post.pk }}"
              hx-swap="afterbegin"
              hx-on::after-request="if(event.detail.successful){ this.reset(); document.getElementById('comments-empty-{{ post.pk }}')?.remove(); }"
              hx-on::response-error="alert(event.detail.xhr.responseText)">

            {% csrf_token %}

            <div class="flex gap-2">

                <textarea name="content"
                          rows="2"
                          required
                          maxlength="100"
                          placeholder="{% trans 'Write a comment...' %}"
                          class="min-w-0 flex-1 resize-none rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-700 placeholder-slate-400 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"></textarea>

                <button type="submit"
                        class="self-end rounded-lg bg-blue-600 px-3 py-2 text-sm font-medium text-white transition hover:bg-blue-700">

                    {% trans "Send" %}

                </button>

            </div>

        </form>

    {% endif %}

</div>

{% if not post.owner.settings.comments_enabled %}

    <div class="flex items-start gap-3 rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-amber-800">

        <svg class="mt-0.5 h-5 w-5 shrink-0"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             viewBox="0 0 24 24"
             aria-hidden="true">
            <path stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 9v3.75m9-1.5a9 9 0 11-18 0 9 9 0 0118 0zm-9 5.25h.008v.008H12V16.5z"/>
        </svg>

        <div>
            <p class="text-sm font-medium">
                {% trans "Comments are disabled." %}
            </p>

            <p class="mt-0.5 text-xs text-amber-700">
                {% trans "Only you can see existing comments." %}
            </p>
        </div>

    </div>

{% endif %}
