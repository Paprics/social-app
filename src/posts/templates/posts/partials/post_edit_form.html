{% load i18n %}

<div id="post-{{ post.pk }}"
     class="p-5">

    <form
        hx-post="{% url 'posts:update' post.pk %}"
        hx-target="#post-{{ post.pk }}"
        hx-swap="outerHTML">

        {% csrf_token %}

        <textarea
            name="content"
            rows="4"
            class="w-full rounded-md border border-slate-300 p-3 text-sm">{{ post.content }}</textarea>


        <div class="mt-3 flex gap-2">

            <button
                type="submit"
                class="px-3 py-1.5 rounded-md bg-blue-600 text-white text-sm">
                {% trans "Save" %}
            </button>


            <button
                type="button"
                hx-get="{% url 'posts:wall_posts' post.author.pk %}"
                hx-target="#post-{{ post.pk }}"
                hx-swap="outerHTML"
                class="px-3 py-1.5 rounded-md bg-slate-200 text-sm">
                {% trans "Cancel" %}
            </button>

        </div>

    </form>

</div>
