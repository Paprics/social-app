{% load i18n %}

<div id="post-{{ post.pk }}"
     class="bg-white rounded-xl shadow-sm border border-slate-200/70 p-5 mb-4">

    <form
        hx-post="{% url 'posts:update' post.pk %}"
        hx-target="#post-{{ post.pk }}"
        hx-swap="outerHTML">

        {% csrf_token %}

        <textarea
            name="content"
            rows="4"
            required
            maxlength="5000"
            class="w-full rounded-md border border-slate-300 p-3 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">{{ form.content.value|default_if_none:"" }}</textarea>

        {% if form.content.errors %}
            <div class="mt-2 text-sm text-red-600">
                {% for error in form.content.errors %}
                    <p>{{ error }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <div class="mt-3 flex gap-2">

            <button
                type="submit"
                class="px-3 py-1.5 rounded-md bg-blue-600 text-white text-sm hover:bg-blue-700 transition">
                {% trans "Save" %}
            </button>

            <button
                type="button"
                hx-get="{% url 'posts:detail' post.pk %}"
                hx-target="#post-{{ post.pk }}"
                hx-swap="outerHTML"
                class="px-3 py-1.5 rounded-md bg-slate-200 text-slate-700 text-sm hover:bg-slate-300 transition">
                {% trans "Cancel" %}
            </button>

        </div>

    </form>

</div>
