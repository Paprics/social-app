{% load i18n %}

<div id="comment-{{ comment.pk }}"
     class="rounded-lg border border-blue-200 bg-blue-50/40 p-3">

    <form hx-post="{% url 'posts:comment_update' comment.pk %}"
          hx-target="#comment-{{ comment.pk }}"
          hx-swap="outerHTML">

        {% csrf_token %}

        <textarea name="content"
                  rows="3"
                  required
                  maxlength="100"
                  class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">{{ form.content.value|default_if_none:"" }}</textarea>

        {% if form.content.errors %}

            <div class="mt-2 text-sm text-red-600">

                {% for error in form.content.errors %}
                    <p>{{ error }}</p>
                {% endfor %}

            </div>

        {% endif %}

        <div class="mt-2 flex gap-2">

            <button type="submit"
                    class="rounded-md bg-blue-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-blue-700">
                {% trans "Save" %}
            </button>

            <button type="button"
                    hx-get="{% url 'posts:comment_detail' comment.pk %}"
                    hx-target="#comment-{{ comment.pk }}"
                    hx-swap="outerHTML"
                    class="rounded-md bg-slate-200 px-3 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-300">
                {% trans "Cancel" %}
            </button>

        </div>

    </form>

</div>
