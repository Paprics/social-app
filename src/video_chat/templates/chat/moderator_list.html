{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-gray-950 text-white p-6">

  <div class="max-w-2xl mx-auto">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-xl font-semibold">Панель модератора</h1>
      <span class="text-xs text-gray-500 bg-gray-800 px-3 py-1 rounded-full">
        {{ request.user.username }} · staff
      </span>
    </div>

    <div class="bg-gray-900 rounded-2xl p-4">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-medium text-gray-300">Активные комнаты</h2>
        <span class="text-xs text-gray-500">обновляется каждые 5с</span>
      </div>

      <!-- HTMX polling каждые 5 секунд -->
      <div id="room-list"
           hx-get="{% url 'chat:moderator_list' %}"
           hx-trigger="load, every 5s"
           hx-target="#room-list"
           hx-swap="innerHTML"
           class="flex flex-col gap-3">
        {% include "chat/partials/room_list.html" %}
      </div>
    </div>
  </div>

</div>
{% endblock %}
