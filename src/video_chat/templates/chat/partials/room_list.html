{% if rooms %}
  {% for room in rooms %}
  <div class="flex items-center justify-between bg-gray-800 rounded-xl px-4 py-3">
    <div class="text-sm">
      <div class="text-white font-mono">{{ room.room_id|slice:":8" }}...</div>
      <div class="text-gray-400 text-xs mt-0.5">Активна {{ room.age }}</div>
    </div>
    <a href="{% url 'chat:moderator_room' room.room_id %}"
       class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm rounded-lg transition-colors">
      Войти
    </a>
  </div>
  {% endfor %}
{% else %}
  <div class="text-center text-gray-500 py-12 text-sm">
    Активных комнат нет
  </div>
{% endif %}
