{# src/messenger/templates/messenger/partials/sidebar.html #}

{% load i18n %}

<aside
    id="messenger-sidebar"
    class="
        flex
        h-full
        min-h-0
        min-w-0
        flex-col
        bg-white
        lg:border-r
        lg:border-slate-200
    "
>
    <header
        class="
            flex
            h-16
            shrink-0
            items-center
            border-b
            border-slate-200
            px-4
        "
    >
        <h1 class="text-base font-semibold text-slate-900">
            {% trans "Messages" %}
        </h1>
    </header>

    <div
        id="messenger-dialog-scroll"
        class="
            min-h-0
            flex-1
            overflow-y-auto
            overscroll-contain
        "
    >
        {% include "messenger/partials/sidebar_content.html" %}
    </div>
</aside>
