{# src/messenger/templates/partials/dialog/message_edit_form.html #}

<form
    method="post"
    hx-post="{% url 'messenger:message_edit' message.id %}"
    hx-target="closest .message"
    hx-swap="outerHTML"
>
    {% csrf_token %}

    <textarea
        name="text"
        rows="3"
        maxlength="5000"
        class="textarea textarea-bordered w-full"
    >{{ message.text }}</textarea>

    <div class="mt-3 flex justify-end gap-2">

        <button
            type="button"
            class="btn btn-ghost"
            hx-get="{% url 'messenger:message_item' message.id %}"
            hx-target="closest .message"
            hx-swap="outerHTML"
        >
            Отмена
        </button>

        <button
            type="submit"
            class="btn btn-primary"
        >
            Сохранить
        </button>

    </div>

</form>
