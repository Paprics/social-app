{# src/messenger/templates/messenger/partials/dialog/message_form.html #}

{% load i18n %}

<form
    id="message-form"
    class="
        shrink-0
        border-t
        border-slate-200
        bg-white
        p-4
    "
    method="post"

    {% if dialog %}
        hx-post="{% url 'messenger:message_create' dialog.public_id %}"
    {% else %}
        hx-post="{% url 'messenger:conversation_send' other_user.id %}"
    {% endif %}

    hx-swap="none"

    hx-on::after-request="
        if(event.detail.successful){
            this.reset();
            document.getElementById('message-text').focus();
        }
    "
>

    {% csrf_token %}

    <div class="flex items-end gap-3">

        <textarea
            id="message-text"
            name="text"
            rows="2"
            maxlength="5000"
            required
            placeholder="{% trans 'Enter a message...' %}"
            class="
                min-h-[3rem]
                flex-1
                resize-none
                rounded-xl
                border
                border-slate-300
                bg-white
                px-4
                py-3
                text-sm
                text-slate-900
                outline-none
                placeholder:text-slate-400
                transition
                duration-200

                focus:border-blue-600
                focus:ring-2
                focus:ring-blue-600/10
            "
        ></textarea>

        <button
            type="submit"
            class="
                inline-flex
                h-12
                shrink-0
                items-center
                justify-center
                rounded-xl
                bg-blue-600
                px-5
                text-sm
                font-medium
                text-white
                transition
                duration-200

                hover:bg-blue-700

                focus:outline-none
                focus-visible:ring-2
                focus-visible:ring-blue-600
                focus-visible:ring-offset-2
            "
        >
            {% trans "Send" %}
        </button>

    </div>

</form>
