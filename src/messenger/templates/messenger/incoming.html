{# Чужие сообщения #}

<div id="message-{{ message.id }}" class="flex justify-start gap-3">

    {% include "components/avatar.html" with profile=message.sender.profile %}

    <div class="max-w-[75%] rounded-2xl bg-gray-200 px-4 py-2 dark:bg-gray-700">

        <div class="text-sm font-semibold">
            {{ message.sender.username }}
        </div>

        <div class="mt-1">
            {{ message.text|linebreaksbr }}
        </div>

        <div class="mt-1 text-right text-xs opacity-70">
            {{ message.created_at|date:"H:i" }}
        </div>

    </div>

</div>
