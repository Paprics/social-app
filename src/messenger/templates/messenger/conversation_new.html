{% extends "messenger/layouts/messenger.html" %}
{% load static %}

{% block messenger_content %}

<div
    id="conversation-page"
    class="flex h-full min-h-0 flex-col"
>

    {% include "messenger/partials/dialog/header.html" %}

    <div
        id="message-list"
        class="min-h-0 flex-1 overflow-y-auto p-4 flex flex-col gap-4"
    >
    </div>

    <form
        id="message-form"
        class="border-t bg-white p-4 pb-6 dark:bg-gray-900"
        method="post"
        hx-post="{% url 'messenger:conversation_send' other_user.id %}"
        hx-swap="none"
    >

        {% csrf_token %}

        <div class="flex items-start gap-3">

            <textarea
                id="message-text"
                name="text"
                rows="2"
                maxlength="5000"
                required
                autocomplete="off"
                placeholder="Введите сообщение..."
                class="
                    flex-1
                    resize-none
                    rounded-xl
                    border
                    border-gray-300
                    bg-gray-50
                    px-4
                    py-3
                    outline-none
                    transition
                    focus:border-blue-500
                    focus:bg-white
                    dark:border-gray-600
                    dark:bg-gray-800
                    dark:focus:border-blue-400
                "
            ></textarea>

            <button
                type="submit"
                class="
                    rounded-xl
                    bg-blue-600
                    px-6
                    py-3
                    font-medium
                    text-white
                    transition
                    hover:bg-blue-700
                "
            >
                Отправить
            </button>

        </div>

    </form>

</div>

{% endblock %}

{% block extra_js %}
<script type="module" src="{% static 'messenger/js/messenger.js' %}"></script>
{% endblock %}
