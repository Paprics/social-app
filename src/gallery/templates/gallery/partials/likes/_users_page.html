{# src/gallery/templates/gallery/partials/likes/_users_page.html #}

{% load i18n %}

<div class="max-h-72 overflow-y-auto p-2">

    {% for liker in likers %}

        <a href="{% url 'users:profile' liker.pk %}"
           class="block rounded-lg px-3 py-2 text-sm font-medium
                  text-slate-700 transition hover:bg-slate-100">
            {{ liker.username }}
        </a>

    {% empty %}

        <div class="px-3 py-3 text-sm text-slate-400">
            {% trans "No likes yet." %}
        </div>

    {% endfor %}

    {% if page_obj.has_next %}

        <div hx-get="{% url 'gallery:photo_likes_list' photo.pk %}?page={{ page_obj.next_page_number }}"
             hx-trigger="intersect once"
             hx-swap="outerHTML"
             class="px-3 py-2 text-center text-xs text-slate-400">
            {% trans "Loading..." %}
        </div>

    {% endif %}

</div>
