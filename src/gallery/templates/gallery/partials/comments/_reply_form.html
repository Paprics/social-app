{% load i18n %}

<div id="photo-comment-reply-slot-{{ parent.pk }}"
     class="mt-3 pl-11">

    <form hx-post="{% url 'gallery:photo_comment_reply' photo.pk parent.pk %}"
          hx-target="#photo-comment-reply-slot-{{ parent.pk }}"
          hx-swap="outerHTML">

        {% csrf_token %}

        {% if comment_form.content.errors %}
            <div class="mb-2 text-xs text-red-600">
                {{ comment_form.content.errors.0 }}
            </div>
        {% endif %}

        <div class="flex gap-2">

            <textarea name="content"
                      rows="1"
                      maxlength="100"
                      required
                      autofocus
                      placeholder="{% trans 'Write a reply...' %}"
                      class="min-h-9 flex-1 resize-none rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none focus:border-blue-400">{{ comment_form.content.value|default_if_none:"" }}</textarea>

            <button type="submit"
                    class="rounded-lg bg-blue-600 px-3 py-2 text-xs font-medium text-white hover:bg-blue-500">
                {% trans "Reply" %}
            </button>

        </div>

    </form>

</div>
