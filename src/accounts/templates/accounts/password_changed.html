{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Password changed" %}{% endblock %}

{% block page %}
<div class="flex min-h-[80vh] items-center justify-center px-4 py-16">
    <div class="w-full max-w-md text-center">

        <div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-xl bg-green-50 border border-green-100">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                 stroke-width="2" stroke="currentColor" class="h-8 w-8 text-green-600">
                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/>
            </svg>
        </div>

        <h1 class="mb-3 text-2xl font-semibold text-slate-900">{% trans "Password changed!" %}</h1>

        <p class="text-slate-500">
            {% trans "Your password has been updated. Please sign in again to continue." %}
        </p>

        <button
            type="button"
            data-modal-open="login-modal"
            class="mt-8 inline-flex items-center rounded-xl bg-blue-600 px-6 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700">
            {% trans "Sign in again" %}
        </button>

    </div>
</div>
{% endblock %}
