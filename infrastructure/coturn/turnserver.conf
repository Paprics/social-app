# turnserver.conf — конфигурация coturn TURN сервера
#
# Переменные TURN_USER и TURN_PASSWORD должны совпадать
# с тем что прописано в .env.prod каждого проекта который использует TURN.

listening-port=3478
tls-listening-port=5349

# Замени на публичный IP сервера
listening-ip=0.0.0.0
external-ip=YOUR_SERVER_PUBLIC_IP

min-port=49152
max-port=49200

# Замени на свои значения и продублируй в .env.prod проектов
user=myuser:mypassword

# Замени на свой домен
realm=example.com

# TLS сертификат — тот же что у nginx (Let's Encrypt)
cert=/etc/letsencrypt/live/example.com/fullchain.pem
pkey=/etc/letsencrypt/live/example.com/privkey.pem

fingerprint
no-multicast-peers

log-file=/var/log/coturn/turnserver.log

# Убери verbose на проде после отладки
verbose