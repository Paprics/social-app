# conf.d/social-network.conf
#
# Nginx проксирует запросы на контейнер sn-web который находится
# в frontend_network. WebSocket для Channels/Daphne тоже через этот upstream.

upstream social_network {
    server sn-web:8000;
}

# HTTP → HTTPS редирект
server {
    listen 80;
    server_name example.com www.example.com;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    # Статика Django — collectstatic кладёт в staticfiles/
    # На проде можно раздавать через volume, но проще через Django/Whitenoise
    location /static/ {
        proxy_pass http://social_network;
    }

    # Медиа файлы
    location /media/ {
        proxy_pass http://social_network;
    }

    # WebSocket — Django Channels / Daphne
    location /ws/ {
        proxy_pass http://social_network;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Всё остальное — Django
    location / {
        proxy_pass http://social_network;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}